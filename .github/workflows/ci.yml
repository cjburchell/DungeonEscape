name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  actions: read

env:
  OBJECTS_DIRECTORY: obj
  NUGET_PACKAGES_DIRECTORY: .nuget
  SOURCE_CODE_PATH: "*/*/"
  RESHARPER_SOLUTION_NAME: DungeonEscape.sln
  RESHARPER_EXCLUDE: ${{ vars.RESHARPER_EXCLUDE || '' }}
  RESHARPER_THRESHOLD: ${{ vars.RESHARPER_THRESHOLD || '0' }}
  RESHARPER_TOOL_VERSION: ${{ vars.RESHARPER_TOOL_VERSION || '2026.1.0.1' }}
  DOTNET_SDK_IMAGE: mcr.microsoft.com/dotnet/sdk:10.0
  UNITY_PROJECT_PATH: DungeonEscape.Unity
  UNITY_CI_IMAGE: unityci/editor:ubuntu-6000.4.4f1-base-3.2.2
  UNITY_WINDOWS_BUILD_IMAGE: unityci/editor:ubuntu-6000.4.4f1-windows-mono-3.2.2
  UNITY_EXECUTABLE: unity-editor
  UNITY_CI_ENABLED: ${{ vars.UNITY_CI_ENABLED || 'true' }}
  UNITY_PLAYMODE_TESTS_ENABLED: ${{ vars.UNITY_PLAYMODE_TESTS_ENABLED || 'false' }}
  UNITY_BUILD_WINDOWS_ENABLED: ${{ vars.UNITY_BUILD_WINDOWS_ENABLED || 'true' }}
  TOOLS_PACKAGE_ENABLED: ${{ vars.TOOLS_PACKAGE_ENABLED || 'true' }}
  CI_PROJECT_DIR: ${{ github.workspace }}
  UNITY_LICENSE_B64: ${{ secrets.UNITY_LICENSE_B64 }}
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
  UNITY_LICENSING_SERVER: ${{ secrets.UNITY_LICENSING_SERVER }}

jobs:
  dotnet-restore:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            .nuget
            */*/obj/project.assets.json
            */*/obj/*.csproj.nuget.*
          key: dotnet-restore-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln', '**/packages.lock.json') }}
          restore-keys: |
            dotnet-restore-${{ runner.os }}-

      - name: Restore .NET solution
        run: bash scripts/ci/dotnet-restore.sh

  dotnet-build:
    runs-on: ubuntu-latest
    needs: dotnet-restore
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: |
            .nuget
            */*/obj/project.assets.json
            */*/obj/*.csproj.nuget.*
          key: dotnet-restore-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln', '**/packages.lock.json') }}
          restore-keys: |
            dotnet-restore-${{ runner.os }}-

      - name: Restore .NET solution
        run: bash scripts/ci/dotnet-restore.sh

      - name: Build .NET solution
        run: bash scripts/ci/dotnet-build.sh

      - name: Upload core plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-build-core-plugin
          if-no-files-found: error
          path: |
            DungeonEscape.Unity/Assets/DungeonEscape/Plugins/DungeonEscape.Core.dll
            DungeonEscape.Unity/Assets/DungeonEscape/Plugins/DungeonEscape.Core.pdb

  dotnet-tests:
    runs-on: ubuntu-latest
    needs: dotnet-build
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: |
            .nuget
            */*/obj/project.assets.json
            */*/obj/*.csproj.nuget.*
          key: dotnet-restore-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln', '**/packages.lock.json') }}
          restore-keys: |
            dotnet-restore-${{ runner.os }}-

      - name: Restore .NET solution
        run: bash scripts/ci/dotnet-restore.sh

      - name: Test .NET solution
        run: bash scripts/ci/dotnet-test.sh

      - name: Upload .NET test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          if-no-files-found: warn
          path: TestResults/dotnet/*.trx

      - name: Publish .NET test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: .NET Tests
          files: TestResults/dotnet/*.trx

  unity-validate:
    runs-on: ubuntu-latest
    needs: dotnet-build
    if: ${{ vars.UNITY_CI_ENABLED != 'false' }}
    container:
      image: unityci/editor:ubuntu-6000.4.4f1-base-3.2.2
    env:
      UNITY_LOG_FILE: ${{ github.workspace }}/DungeonEscape.Unity/Logs/ci-unity-validate.log
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download core plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build-core-plugin
          path: DungeonEscape.Unity/Assets/DungeonEscape/Plugins

      - name: Configure Unity license
        run: |
          mkdir -p /root/.local/share/unity3d/Unity
          echo "Unity CI variable presence: UNITY_LICENSE_B64=$([ -n "$UNITY_LICENSE_B64" ] && echo set || echo unset), UNITY_LICENSE=$([ -n "$UNITY_LICENSE" ] && echo set || echo unset), UNITY_SERIAL=$([ -n "$UNITY_SERIAL" ] && echo set || echo unset), UNITY_EMAIL=$([ -n "$UNITY_EMAIL" ] && echo set || echo unset), UNITY_PASSWORD=$([ -n "$UNITY_PASSWORD" ] && echo set || echo unset), UNITY_LICENSING_SERVER=$([ -n "$UNITY_LICENSING_SERVER" ] && echo set || echo unset)"
          if [ -n "$UNITY_LICENSE_B64" ]; then
            printf '%s' "$UNITY_LICENSE_B64" | tr -d '\r\n\t ' | base64 -d > /root/.local/share/unity3d/Unity/Unity_lic.ulf
            echo "Unity license file written from UNITY_LICENSE_B64."
          elif [ -n "$UNITY_LICENSE" ]; then
            echo "$UNITY_LICENSE" | tr -d '\r' > /root/.local/share/unity3d/Unity/Unity_lic.ulf
            echo "Unity license file written from UNITY_LICENSE."
          elif [ -n "$UNITY_SERIAL" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            "$UNITY_EXECUTABLE" -batchmode -nographics -quit -logFile /dev/stdout -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -serial "$UNITY_SERIAL"
          elif [ -n "$UNITY_LICENSING_SERVER" ]; then
            echo "UNITY_LICENSING_SERVER is configured; Unity will attempt license server activation."
          else
            echo "No Unity license variables configured. Set UNITY_LICENSE_B64, UNITY_LICENSE, or UNITY_SERIAL, UNITY_EMAIL, and UNITY_PASSWORD in GitHub secrets."
          fi

      - name: Validate Unity project
        run: bash scripts/ci/unity-validate.sh

      - name: Return Unity license
        if: always()
        run: |
          if [ -n "$UNITY_SERIAL" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_LICENSE_B64" ]; then
            "$UNITY_EXECUTABLE" -batchmode -nographics -quit -logFile /dev/stdout -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -returnlicense || true
          fi

      - name: Upload Unity validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-validation
          if-no-files-found: warn
          path: |
            DungeonEscape.Unity/Logs/ci-unity-validate.log
            DungeonEscape.Unity/Logs/ReSharperReferences/*.dll
            DungeonEscape.Unity/*.sln
            DungeonEscape.Unity/*.csproj

  unity-editmode-tests:
    runs-on: ubuntu-latest
    needs:
      - dotnet-build
      - unity-validate
    if: ${{ vars.UNITY_CI_ENABLED != 'false' }}
    container:
      image: unityci/editor:ubuntu-6000.4.4f1-base-3.2.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download core plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build-core-plugin
          path: DungeonEscape.Unity/Assets/DungeonEscape/Plugins

      - name: Configure Unity license
        run: |
          mkdir -p /root/.local/share/unity3d/Unity
          if [ -n "$UNITY_LICENSE_B64" ]; then
            printf '%s' "$UNITY_LICENSE_B64" | tr -d '\r\n\t ' | base64 -d > /root/.local/share/unity3d/Unity/Unity_lic.ulf
          elif [ -n "$UNITY_LICENSE" ]; then
            echo "$UNITY_LICENSE" | tr -d '\r' > /root/.local/share/unity3d/Unity/Unity_lic.ulf
          elif [ -n "$UNITY_SERIAL" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            "$UNITY_EXECUTABLE" -batchmode -nographics -quit -logFile /dev/stdout -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -serial "$UNITY_SERIAL"
          fi

      - name: Run Unity Edit Mode tests
        run: bash scripts/ci/unity-editmode-tests.sh

      - name: Return Unity license
        if: always()
        run: |
          if [ -n "$UNITY_SERIAL" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_LICENSE_B64" ]; then
            "$UNITY_EXECUTABLE" -batchmode -nographics -quit -logFile /dev/stdout -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -returnlicense || true
          fi

      - name: Upload Unity Edit Mode test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-test-results
          if-no-files-found: warn
          path: |
            TestResults/editmode-results.xml
            TestResults/editmode-log.txt

      - name: Publish Unity Edit Mode test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Unity Edit Mode Tests
          files: TestResults/editmode-results.xml

  unity-playmode-tests:
    runs-on: ubuntu-latest
    needs:
      - dotnet-build
      - unity-validate
    if: ${{ vars.UNITY_CI_ENABLED != 'false' && vars.UNITY_PLAYMODE_TESTS_ENABLED == 'true' }}
    container:
      image: unityci/editor:ubuntu-6000.4.4f1-base-3.2.2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download core plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build-core-plugin
          path: DungeonEscape.Unity/Assets/DungeonEscape/Plugins

      - name: Configure Unity license
        run: |
          mkdir -p /root/.local/share/unity3d/Unity
          if [ -n "$UNITY_LICENSE_B64" ]; then
            printf '%s' "$UNITY_LICENSE_B64" | tr -d '\r\n\t ' | base64 -d > /root/.local/share/unity3d/Unity/Unity_lic.ulf
          elif [ -n "$UNITY_LICENSE" ]; then
            echo "$UNITY_LICENSE" | tr -d '\r' > /root/.local/share/unity3d/Unity/Unity_lic.ulf
          elif [ -n "$UNITY_SERIAL" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            "$UNITY_EXECUTABLE" -batchmode -nographics -quit -logFile /dev/stdout -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -serial "$UNITY_SERIAL"
          fi

      - name: Run Unity Play Mode tests
        run: bash scripts/ci/unity-playmode-tests.sh

      - name: Return Unity license
        if: always()
        run: |
          if [ -n "$UNITY_SERIAL" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_LICENSE_B64" ]; then
            "$UNITY_EXECUTABLE" -batchmode -nographics -quit -logFile /dev/stdout -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -returnlicense || true
          fi

      - name: Upload Unity Play Mode test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-playmode-test-results
          if-no-files-found: warn
          path: |
            TestResults/playmode-results.xml
            TestResults/playmode-log.txt

      - name: Publish Unity Play Mode test report
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Unity Play Mode Tests
          files: TestResults/playmode-results.xml

  unity-build-windows:
    runs-on: ubuntu-latest
    needs:
      - dotnet-build
      - dotnet-tests
      - unity-editmode-tests
      - unity-playmode-tests
    if: ${{ always() && vars.UNITY_BUILD_WINDOWS_ENABLED != 'false' && needs.dotnet-build.result == 'success' && needs.dotnet-tests.result == 'success' && needs.unity-editmode-tests.result == 'success' && (needs.unity-playmode-tests.result == 'success' || needs.unity-playmode-tests.result == 'skipped') }}
    container:
      image: unityci/editor:ubuntu-6000.4.4f1-windows-mono-3.2.2
    env:
      UNITY_LOG_FILE: ${{ github.workspace }}/DungeonEscape.Unity/Logs/ci-unity-build-windows.log
      UNITY_WINDOWS_BUILD_PATH: DungeonEscape.Unity/Builds/Windows
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download core plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build-core-plugin
          path: DungeonEscape.Unity/Assets/DungeonEscape/Plugins

      - name: Configure Unity license
        run: |
          mkdir -p /root/.local/share/unity3d/Unity
          if [ -n "$UNITY_LICENSE_B64" ]; then
            printf '%s' "$UNITY_LICENSE_B64" | tr -d '\r\n\t ' | base64 -d > /root/.local/share/unity3d/Unity/Unity_lic.ulf
          elif [ -n "$UNITY_LICENSE" ]; then
            echo "$UNITY_LICENSE" | tr -d '\r' > /root/.local/share/unity3d/Unity/Unity_lic.ulf
          elif [ -n "$UNITY_SERIAL" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; then
            "$UNITY_EXECUTABLE" -batchmode -nographics -quit -logFile /dev/stdout -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -serial "$UNITY_SERIAL"
          fi

      - name: Build Unity Windows artifact
        run: bash scripts/ci/unity-build-windows.sh

      - name: Return Unity license
        if: always()
        run: |
          if [ -n "$UNITY_SERIAL" ] && [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ] && [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_LICENSE_B64" ]; then
            "$UNITY_EXECUTABLE" -batchmode -nographics -quit -logFile /dev/stdout -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -returnlicense || true
          fi

      - name: Upload Unity Windows build
        uses: actions/upload-artifact@v4
        with:
          name: DungeonEscape-Windows-${{ github.sha }}
          if-no-files-found: error
          path: |
            DungeonEscape.Unity/Builds/Windows/
            DungeonEscape.Unity/Logs/ci-unity-build-windows.log

  tools-package:
    runs-on: ubuntu-latest
    needs:
      - dotnet-build
      - dotnet-tests
    if: ${{ vars.TOOLS_PACKAGE_ENABLED != 'false' }}
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: |
            .nuget
            */*/obj/project.assets.json
            */*/obj/*.csproj.nuget.*
          key: dotnet-restore-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln', '**/packages.lock.json') }}
          restore-keys: |
            dotnet-restore-${{ runner.os }}-

      - name: Restore .NET solution
        run: bash scripts/ci/dotnet-restore.sh

      - name: Package tools
        run: bash scripts/ci/tools-package.sh

      - name: Upload tools package
        uses: actions/upload-artifact@v4
        with:
          name: DungeonEscape-Tools-${{ github.sha }}
          if-no-files-found: error
          path: artifacts/tools/

  resharper-scan:
    runs-on: ubuntu-latest
    needs:
      - dotnet-build
      - unity-validate
    if: ${{ always() && needs.dotnet-build.result == 'success' && (needs.unity-validate.result == 'success' || needs.unity-validate.result == 'skipped') }}
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore NuGet cache
        uses: actions/cache@v4
        with:
          path: |
            .nuget
            */*/obj/project.assets.json
            */*/obj/*.csproj.nuget.*
          key: dotnet-restore-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/*.sln', '**/packages.lock.json') }}
          restore-keys: |
            dotnet-restore-${{ runner.os }}-

      - name: Download core plugin artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-build-core-plugin
          path: DungeonEscape.Unity/Assets/DungeonEscape/Plugins

      - name: Download Unity validation artifacts
        if: ${{ needs.unity-validate.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: unity-validation
          path: DungeonEscape.Unity

      - name: List Unity ReSharper references
        if: ${{ needs.unity-validate.result == 'success' }}
        run: find DungeonEscape.Unity/Logs/ReSharperReferences -maxdepth 1 -name '*.dll' | sort | head -50

      - name: Run ReSharper inspection
        id: resharper-inspection
        continue-on-error: true
        run: |
          set +e
          bash scripts/ci/resharper-scan.sh
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 2 ]; then
            echo "::warning::ReSharper issues exceeded RESHARPER_THRESHOLD. Reports will be uploaded for cleanup."
            exit 1
          fi
          exit "$code"

      - name: Fail on ReSharper infrastructure errors
        if: ${{ steps.resharper-inspection.outputs.exit_code != '0' && steps.resharper-inspection.outputs.exit_code != '2' }}
        run: |
          echo "ReSharper inspection failed for a non-threshold reason with exit code ${{ steps.resharper-inspection.outputs.exit_code }}."
          exit 1

      - name: Upload ReSharper reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resharper-reports
          if-no-files-found: warn
          path: RsInspection*.xml